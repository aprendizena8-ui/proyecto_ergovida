spring.application.name=backend

spring.config.import=optional:file:db.properties,optional:file:backend/db.properties

# Puerto del servidor
server.port=8080

# # Conexion MySQL
# spring.datasource.url=jdbc:mysql://localhost:3306/ergovida_db
# spring.datasource.username=root
# spring.datasource.password=

# Conexion MySQL en Aiven (Nube)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialecto
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Roles asignados automaticamente por correo (comparacion sin mayusculas ni espacios)
# ADMIN_EMAILS admite varios correos separados por coma; agrega el segundo admin aqui.
ergovida.auth.admin-emails=${ADMIN_EMAILS:ergovida.sena@gmail.com}
ergovida.auth.leader-emails=${LEADER_EMAILS:kmorenoa@sena.edu.co,aprendizena8@gmail.com}

# Zona horaria de fechas serializadas y del scheduler de recordatorios
spring.jackson.time-zone=America/Bogota

# Recordatorios (scheduler del servidor: funciona con la app cerrada)
ergovida.recordatorios.scheduler.enabled=${RECORDATORIOS_SCHEDULER_ENABLED:true}

# Alertas automaticas por correo (agrupadas por intervalo)
ergovida.alertas.error.intervalo-minutos=${ALERTAS_ERROR_INTERVALO_MINUTOS:15}

# Notificaciones push con Firebase Cloud Messaging (HTTP v1)
# Las credenciales SOLO se leen de variables de entorno.
ergovida.push.enabled=${FCM_ENABLED:false}
ergovida.push.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:}
ergovida.push.service-account-json=${FIREBASE_SERVICE_ACCOUNT_JSON:}
ergovida.push.project-id=${FIREBASE_PROJECT_ID:}

