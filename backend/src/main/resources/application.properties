spring.application.name=backend

# Puerto del servidor
server.port=8080

# Conexion MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/ergovida_db
spring.datasource.username=root
spring.datasource.password=

# Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialecto
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Recordatorios
ergovida.recordatorios.scheduler.enabled=true

# Mail configuration (Gmail)
# Se puede sobrescribir con variables de entorno MAIL_USERNAME / MAIL_PASSWORD.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.default-encoding=UTF-8

spring.mail.username=${MAIL_USERNAME:ergovida.sena@gmail.com}
spring.mail.password=${MAIL_PASSWORD:uyjzbijcqvalmbkd}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000