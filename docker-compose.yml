version: '3.8'

services:
  nginx:
    image: nginx:latest
    container_name: nginx-balanceador
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-backend

  api-backend:
    build: .
    # Se agrega --threads 4 para que los trabajadores atiendan peticiones en paralelo sin bloquear /health
    command: ["gunicorn", "-w", "2", "--threads", "4", "-b", "0.0.0.0:5000", "app:app"]
    expose:
      - "5000"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:5000/health\")' || exit 1"]
      # Tolerancias ajustadas a la realidad de la aplicación
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      replicas: 4
      resources:
        limits:
          cpus: '0.15'
          memory: 128M

  log-viewer:
    image: amir20/dozzle:latest
    container_name: dozzle-monitor
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock